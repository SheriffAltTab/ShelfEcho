name: Deploy ShelfEcho

# Example: deploy to an EC2 (or other) host over SSH — API + SQLite on the same machine.
# For a split layout, replace the remote script with: build frontend → aws s3 sync dist/ … → aws cloudfront create-invalidation …,
# and run the API separately on ECS/Fargate or another EC2 with the same env/secrets.

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to AWS via SSH
        uses: appleboy/ssh-action@master
        # 1. Оголошуємо змінні для плагіна (додано пошту)
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          # 2. Передаємо їх у скрипт
          envs: GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,GOOGLE_REDIRECT_URI,GMAIL_USER,GMAIL_APP_PASSWORD,EMAIL_FROM,JWT_SECRET
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            
            cd ~/ShelfEcho
            git fetch --all
            git reset --hard origin/master
            
            # Фронтенд .env
            echo "VITE_API_URL=https://shelfecho.site/api" > .env
            npm install
            npm run build
            
            # Бекенд .env
            cd server
            # Записуємо базові налаштування
            echo "PORT=3001" > .env
            echo "BIND_HOST=0.0.0.0" >> .env
            echo "FRONTEND_URL=https://shelfecho.site" >> .env
            echo "NODE_ENV=production" >> .env
            echo "JWT_SECRET=$JWT_SECRET" >> .env
            
            # Додаємо секрети від Google
            echo "GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID" >> .env
            echo "GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> .env
            echo "GOOGLE_REDIRECT_URI=$GOOGLE_REDIRECT_URI" >> .env
            
            # Додаємо секрети для пошти
            echo "GMAIL_USER=$GMAIL_USER" >> .env
            echo "GMAIL_APP_PASSWORD=$GMAIL_APP_PASSWORD" >> .env
            echo "EMAIL_FROM=$EMAIL_FROM" >> .env
            
            npm install
            npm run build
            
            pm2 restart shelfecho || pm2 start dist/index.js --name "shelfecho"
